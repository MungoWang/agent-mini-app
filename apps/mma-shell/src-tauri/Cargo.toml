[package]
name = "mma-shell"
version = "0.1.0"
description = "Monkey Mini App Tauri Shell — owns Host process + Panel webview"
authors = ["monkey-mini-app"]
edition = "2021"

[lib]
name = "mma_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
