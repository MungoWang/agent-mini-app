name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:skill
      # contracts are generated: committed docs must match source
      - run: pnpm gen:skill && pnpm gen:examples && git diff --exit-code skills packages/ui/ai apps/dsh-host/fixtures
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm --filter @monkey-mini-app/dsh-mini-app build
