name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:skill
      # contracts are generated: committed docs must match source
      - run: pnpm gen:skill && pnpm gen:examples && git diff --exit-code skills packages/ui/ai apps/dsh-host/fixtures
      - run: pnpm check:format
      - run: pnpm check:templates
      # package subpath exports (@monkey-mini-app/panel/themes) resolve through dist, so the
      # two libraries the adapters type against must be built before every tsconfig is read
      - run: pnpm --filter @monkey-mini-app/host --filter @monkey-mini-app/panel build
      # every tsconfig in the repo, not just the root aggregate (AGENTS.md → Gates)
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @monkey-mini-app/dsh-mini-app build
      # Playwright suites (apps/demo-host/e2e, pnpm test:dsh) are deliberately NOT run here:
      # local acceptance only — see AGENTS.md → Gates
