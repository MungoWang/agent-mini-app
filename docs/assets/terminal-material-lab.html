<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>终端等宽 · 磷光打样 A/B</title>
  <style>
    :root { font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f2f3f5; }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { font-size: 20px; }
    .lede { color: #555; margin: 6px 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #e4e6ea; border-radius: 12px; overflow: hidden; }
    .head { padding: 8px 12px; border-bottom: 1px solid #edf0f3; }
    .head b { font-size: 12px; letter-spacing: 0.04em; }

    /* ---- terminal recipe (locked-ish): lamps + command bar + scanline well ---- */
    .field {
      position: relative; overflow: hidden; height: 300px;
      background: var(--bg); color: var(--fg);
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex; flex-direction: column;
    }
    .hdr { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-bottom: 1px solid var(--bd); color: var(--mut); flex: none; }
    .lamp { width: 8px; height: 8px; border-radius: 999px; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
    .pill { margin-left: auto; font-size: 10px; border: 1px solid var(--bd); border-radius: 6px; padding: 0 6px; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--bd); flex: none; }
    .caret { color: var(--mut); }
    .cmd { flex: 1; opacity: .9; }
    .go { font-size: 10px; border: 1px solid var(--bd); border-radius: 6px; padding: 1px 8px; color: var(--fg); }
    .wellwrap { position: relative; flex: 1; min-height: 0; }
    .well {
      position: absolute; inset: 10px 12px; overflow: hidden;
      border: 1px solid var(--bd); border-radius: 8px;
      background: var(--well); padding: 8px 10px;
    }
    .well::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      /* scanlines + phosphor bloom + corner vignette */
      background:
        repeating-linear-gradient(0deg, color-mix(in oklch, var(--fg) 7%, transparent) 0 1px, transparent 1px 3px),
        radial-gradient(120% 90% at 50% 40%, transparent 62%, color-mix(in oklch, var(--vs) 32%, transparent));
    }
    .well .glow { text-shadow: 0 0 6px color-mix(in oklch, var(--acc) 70%, transparent); }
    .ok { color: var(--acc); }
    .dim { opacity: .55; }
    .cursor { display: inline-block; width: 7px; height: 13px; vertical-align: -2px; background: var(--acc); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="page">
    <h1>终端等宽 · 磷光打样</h1>
    <p class="lede">配方锁定：lamp 头 + 命令条 + 井内扫描线/辉光/边缘渐晕。四组底色 × 磷光候选，亮/暗并排。回编号即可（亮暗也可分开混选）。</p>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const CANDS = [
      {
        id: "A 现行 GitHub 夜绿",
        light: { bg: "#f3f5f0", fg: "#16241a", bd: "#d3dbd0", mut: "#4a5a4e", acc: "#1a7f37", well: "#ffffff", vs: "#16241a" },
        dark:  { bg: "#12141a", fg: "#d7f7c8", bd: "#262b34", mut: "#8b96a5", acc: "#7ee787", well: "#0d1017", vs: "#000000" },
      },
      {
        id: "B 纯磷光绿 CRT",
        light: { bg: "#ecefe4", fg: "#12290f", bd: "#ccd5c0", mut: "#4c5f44", acc: "#157a24", well: "#f7faf1", vs: "#1b2f16" },
        dark:  { bg: "#0a0d08", fg: "#3dff6e", bd: "#1d2a18", mut: "#5f8a55", acc: "#3dff6e", well: "#060904", vs: "#000000" },
      },
      {
        id: "C 琥珀磷光",
        light: { bg: "#f4efe2", fg: "#33210a", bd: "#d9cfae", mut: "#6d5c36", acc: "#a3680a", well: "#faf6e9", vs: "#33210a" },
        dark:  { bg: "#14100a", fg: "#ffb424", bd: "#2c2314", mut: "#8a6f3d", acc: "#ffb424", well: "#0c0904", vs: "#000000" },
      },
      {
        id: "D 冷青夜航",
        light: { bg: "#eef2f4", fg: "#14242c", bd: "#cfdbe0", mut: "#4c626c", acc: "#0d7f8c", well: "#ffffff", vs: "#14242c" },
        dark:  { bg: "#0c1216", fg: "#a7f2f4", bd: "#1e2d35", mut: "#5b7783", acc: "#48dbe0", well: "#070c0f", vs: "#000000" },
      },
    ];

    const lines = [
      ["$ runner run --goal 读取组件导出清单", ""],
      ["● 扫描 src/**", "ok"],
      ["● 汇总 34 个导出", "ok"],
      ["● 写入 storage/exports.md", "ok"],
      ["✓ 完成 · 3 步 · 8.2s", "glow ok"],
    ];
    const grid = document.getElementById("grid");
    for (const p of CANDS) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="head"><b>${p.id}</b></div>`;
      const row = document.createElement("div");
      row.style.display = "flex";
      for (const mode of ["light", "dark"]) {
        const v = p[mode];
        const f = document.createElement("div");
        f.className = "field";
        for (const k of ["bg", "fg", "bd", "mut", "acc", "well", "vs"]) f.style.setProperty("--" + k, v[k]);
        f.style.flex = "1";
        f.innerHTML = `
          <div class="hdr"><span class="lamp"></span>runner · 生成导出清单<span class="pill">running</span></div>
          <div class="bar"><span class="caret">❯</span><span class="cmd">读取 packages/ui/src 下组件…</span><span class="go">运行</span></div>
          <div class="wellwrap"><div class="well">
            ${lines.map(([t, cls]) => `<div class="${cls}">${t}</div>`).join("")}
            <div class="dim">$ <span class="cursor"></span></div>
          </div></div>`;
        row.appendChild(f);
      }
      card.appendChild(row);
      grid.appendChild(card);
    }
  </script>
</body>
</html>
