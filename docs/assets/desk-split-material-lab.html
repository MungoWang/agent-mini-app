<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桌面分栏 · 材质打样 A/B</title>
  <style>
    :root { font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f2f3f5; }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { font-size: 20px; }
    .lede { color: #555; margin: 6px 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #e4e6ea; border-radius: 12px; overflow: hidden; }
    .head { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid #edf0f3; }
    .head b { font-size: 12px; letter-spacing: 0.04em; }
    .head span { font-size: 11px; color: #888; }

    /* ---- desk recipe (locked): wood-like striped ground, paper panes ---- */
    .field {
      position: relative; overflow: hidden; height: 300px; padding: 16px;
      background-color: var(--bg);
      /* wood grain: vertical bands + a lamp glow top-left + vignette */
      background-image:
        radial-gradient(520px 260px at 14% -10%, color-mix(in oklch, var(--accent) 34%, transparent), transparent 70%),
        radial-gradient(360px 260px at 50% 110%, color-mix(in oklch, var(--fg) 22%, transparent), transparent 72%),
        repeating-linear-gradient(90deg, color-mix(in oklch, var(--fg) 6%, transparent) 0 2px, transparent 2px 26px),
        repeating-linear-gradient(90deg, color-mix(in oklch, var(--fg) 10%, transparent) 0 1px, transparent 1px 90px);
      color: var(--fg);
    }
    .desk {
      position: relative; display: grid; grid-template-columns: 5fr 7fr; gap: 10px; height: 100%;
    }
    .paper {
      border-radius: 14px; overflow: hidden;
      background: var(--card);
      border: 1px solid color-mix(in oklch, var(--fg) 10%, transparent);
      box-shadow:
        0 1px 2px color-mix(in oklch, var(--fg) 30%, transparent),
        0 12px 28px -10px var(--shadow),
        inset 0 1px 0 color-mix(in oklch, #ffffff 50%, transparent);
    }
    .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid color-mix(in oklch, var(--fg) 10%, transparent); }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid color-mix(in oklch, var(--fg) 20%, transparent); opacity: .75; }
    .rows li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px; font-size: 12px; border-bottom: 1px solid color-mix(in oklch, var(--fg) 6%, transparent); }
    .rows li.on { background: color-mix(in oklch, var(--accent) 20%, transparent); }
    .rows li:last-child { border-bottom: none; }
    .rows em { font-style: normal; opacity: .6; font-variant-numeric: tabular-nums; }
    .detail { padding: 14px 16px; }
    .detail h3 { font-family: ui-serif, Georgia, serif; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .detail p.meta { font-size: 11px; opacity: .6; margin-bottom: 10px; }
    .kpi { display: flex; gap: 10px; }
    .kpi div { flex: 1; border: 1px solid color-mix(in oklch, var(--fg) 10%, transparent); border-radius: 10px; padding: 6px 8px; }
    .kpi b { display: block; font-variant-numeric: tabular-nums; font-size: 15px; }
    .kpi span { font-size: 10px; opacity: .6; }
    .btn { display: inline-block; margin-top: 10px; font-size: 12px; padding: 4px 12px; border-radius: 8px; background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <div class="page">
    <h1>桌面分栏 · 材质打样</h1>
    <p class="lede">纸卡配方已固定（暖白纸卡 + 木纹条带 + 台灯光泽）。四组「地面/灯色」候选，亮/暗并排，和线上结构一致。回我编号。</p>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const CANDS = [
      {
        id: "A 胡桃木 + 琥珀灯",
        light: { bg: "#8a6845", fg: "#3a2b18", card: "#faf5ea", accent: "#c98f2e", shadow: "rgba(48,32,12,0.42)" },
        dark:  { bg: "#3b2c18", fg: "#efe4cd", card: "#f5eedb", accent: "#d9a643", shadow: "rgba(8,5,1,0.6)" },
      },
      {
        id: "B 橡木 + 乳白灯",
        light: { bg: "#c9a877", fg: "#4a3418", card: "#fdf8ec", accent: "#a9762c", shadow: "rgba(96,72,32,0.4)" },
        dark:  { bg: "#241b10", fg: "#e8dcc2", card: "#efe6d0", accent: "#c99a4a", shadow: "rgba(6,4,1,0.62)" },
      },
      {
        id: "C 墨绿桌垫",
        light: { bg: "#3d5a4b", fg: "#e8efe7", card: "#f6f4e8", accent: "#c9b458", shadow: "rgba(12,28,20,0.5)" },
        dark:  { bg: "#14231c", fg: "#dfe9dd", card: "#eef0df", accent: "#c9b458", shadow: "rgba(2,8,5,0.66)" },
      },
      {
        id: "D 水泥灰 + 冷白",
        light: { bg: "#9a9994", fg: "#28282a", card: "#f4f4f2", accent: "#5b7fa6", shadow: "rgba(24,24,24,0.38)" },
        dark:  { bg: "#1f2022", fg: "#e4e4e0", card: "#efefec", accent: "#8db2d8", shadow: "rgba(0,0,0,0.62)" },
      },
    ];

    const rows = [
      ["核对 Q3 回款", "09:30", 1],
      ["华东线索跟进", "10:15", 0],
      ["导出对账单", "11:00", 0],
    ];
    const grid = document.getElementById("grid");
    for (const p of CANDS) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="head"><b>${p.id}</b><span>light / dark 并排</span></div>`;
      const row = document.createElement("div");
      row.style.display = "flex";
      for (const mode of ["light", "dark"]) {
        const v = p[mode];
        const f = document.createElement("div");
        f.className = "field";
        f.style.setProperty("--bg", v.bg);
        f.style.setProperty("--fg", v.fg);
        f.style.setProperty("--card", v.card);
        f.style.setProperty("--accent", v.accent);
        f.style.setProperty("--shadow", v.shadow);
        f.style.flex = "1";
        f.innerHTML = `
          <div class="desk">
            <div class="paper">
              <div class="bar"><b style="font-size:12px">全部 3</b><span class="chip">财务</span><span class="chip">销售</span></div>
              <ul class="rows">
                ${rows.map(([t, m, on]) => `<li class="${on ? "on" : ""}"><span>${t}</span><em>${m}</em></li>`).join("")}
              </ul>
            </div>
            <div class="paper">
              <div class="detail">
                <h3>核对 Q3 回款</h3>
                <p class="meta">今天 09:30 · 财务</p>
                <div class="kpi">
                  <div><b>¥128k</b><span>应收</span></div>
                  <div><b>¥96k</b><span>已回款</span></div>
                  <div><b>12</b><span>账单</span></div>
                </div>
                <span class="btn">打开</span>
              </div>
            </div>
          </div>`;
        row.appendChild(f);
      }
      card.appendChild(row);
      grid.appendChild(card);
    }
  </script>
</body>
</html>
